apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-events-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eventhub
      app.kubernetes.io/component: notifications-events-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eventhub
        app.kubernetes.io/component: notifications-events-consumer
    spec:
      containers:
        - name: notifications-events-consumer
          image: ghcr.io/gnumoksha/eventhub-core:latest
          imagePullPolicy: Always
          command:
            - python
            - -m
            - packages.notifications.bin.events_consumer
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
