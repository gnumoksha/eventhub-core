apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  LOGGING_LEVEL: "INFO"
  PUBLIC_URL: "https://eventhub.tobias.ws"
  CORS_ALLOWED_ORIGINS: "https://eventhub.tobias.ws"
  QUEUE_RESULT_BACKEND_DSN: "redis://redis:6379/0"
  POSTGRES_DB: "eventhub"
  POSTGRES_USER: "eventhub"
  RABBITMQ_DEFAULT_USER: "eventhub"
