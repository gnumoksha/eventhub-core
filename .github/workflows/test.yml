name: Test

on:
  pull_request:
    types: [opened, reopened, synchronize]

  workflow_dispatch:
    inputs:

env:
  APP_ENV: test
  DATABASE_URL: postgresql://eventhub:eventhub@localhost:5432/eventhub_test
  REDIS_DSN: redis://localhost:6379

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache Python requirements
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          # cache: 'pip' # caching pip dependencies
          # cache-dependency-path: '**/uv.lock'

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
            ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install requirements
        run: |
          set -euo pipefail

          uv sync --verbose --color never

      - name: Ruff check
        run: uv run ruff check packages/ src/

      - name: Ruff format
        # fix errors running: uv run ruff format bin/ packages/ src/
        run: uv run ruff format --check bin/ packages/ src/

      - name: ty
        # fix errors running: uv run ty check --error-on-warning --fix bin/ packages/ src/
        run: |
          uv run ty check --error-on-warning --output-format github bin/ packages/ src/ \
          --exclude packages/libs/tests

  # This job runs the tests for small packages. They are not split into many jobs
  # because the execution time of each job will be higher than running everything
  # together, because of the database setup.
  test-all-packages:
    runs-on: ubuntu-latest
    needs: static-analysis

    services:
      postgresql:
        image: postgres:17.4
        env:
          POSTGRES_DB: eventhub_test
          POSTGRES_USER: eventhub
          POSTGRES_PASSWORD: eventhub
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache Python requirements
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
            ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up environment variables
        run: cp .env.example .env

      - name: Running database migrations
        run: uv run alembic upgrade head

      # - name: Test checkin package
      #   run: uv run pytest -m "not llm_access" --junitxml=tests/report.xml packages/checkin/tests

      - name: Test events package
        run: uv run pytest -m "not llm_access" --junitxml=tests/report.xml packages/events/tests

      # - name: Test finance package
      #   run: uv run pytest -m "not llm_access" --junitxml=tests/report.xml packages/finance/tests

      - name: Test identity package
        run: uv run pytest -m "not llm_access" --junitxml=tests/report.xml packages/identity/tests

      - name: Test libs package
        run: uv run pytest -m "not llm_access" --junitxml=tests/report.xml packages/libs/tests

      # - name: Test notifications package
      #   run: uv run pytest -m "not llm_access" --junitxml=tests/report.xml packages/notifications/tests

      # - name: Test organizers package
      #   run: uv run pytest -m "not llm_access" --junitxml=tests/report.xml packages/organizers/tests

      # - name: Test payments package
      #   run: uv run pytest -m "not llm_access" --junitxml=tests/report.xml packages/payments/tests

      # - name: Test reporting package
      #   run: uv run pytest -m "not llm_access" --junitxml=tests/report.xml packages/reporting/tests

      # - name: Test sales package
      #   run: uv run pytest -m "not llm_access" --junitxml=tests/report.xml packages/sales/tests

      - name: Test shared package
        run: uv run pytest -m "not llm_access" --junitxml=tests/report.xml packages/shared/tests

      # - name: Test ticketing package
      #   run: uv run pytest -m "not llm_access" --junitxml=tests/report.xml packages/ticketing/tests

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            ./tests/report.xml
          if-no-files-found: warn
          retention-days: 1
