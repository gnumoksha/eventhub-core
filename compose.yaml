  #         target: /app/packages/foo_package/src/foo_package/infra/tasks.py
  #         action: sync+restart

  postgresql:
    image: postgres:18
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "database:/var/lib/postgresql"
      - "./var/docker/postgresql/initdb.d:/docker-entrypoint-initdb.d"
    environment:
      POSTGRES_DB: eventhub
      POSTGRES_USER: eventhub
      POSTGRES_PASSWORD: eventhub

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: eventhub
      RABBITMQ_DEFAULT_PASS: eventhub
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    # TODO decrease the log level
    # https://github.com/docker-library/rabbitmq/issues/118
    #RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit log.console.level warning

volumes:
  database:
