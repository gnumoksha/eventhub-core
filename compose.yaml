services:
  app-web:
    image: eventhub/core-web:latest
    build:
      context: .
      dockerfile: ./var/docker/Dockerfile
      target: production
      ssh:
        - default
    ports:
      # Default to the classic port for a plain `docker compose up`. Override per
      # worktree (e.g. WEB_PORT=0 for a random free port) to run stacks in parallel.
      - "${WEB_PORT:-8000}:8000"
    environment:
      # Include development dependencies when working locally
      - UV_NO_DEV=0
      - APP_VERSION=0.0.0
    command: [ "uv", "run", "fastapi", "dev", "src/eventhub_core/main.py", "--host", "0.0.0.0", "--port", "8000" ]
    # Run as root during development so the environment is mutable
    # Alternatively, you could set `UV_PROJECT_ENVIRONMENT` to a path owned by the non-root user
    user: root
    volumes:
      - .:/app
      - /app/.venv
    develop:
      # Create a `watch` configuration to update the app
      # https://docs.docker.com/compose/file-watch/#compose-watch-versus-bind-mounts
      watch:
        # Sync the working directory with the `/app` directory in the container
        - action: sync
          path: .
          target: /app
          # Exclude the project virtual environment — it could be for a
          # different platform in the container
          ignore:
            - .venv/
        # Rebuild the image if dependencies change by checking uv.lock
        - action: rebuild
          path: ./uv.lock

  # Publishes the integration events stored in the transactional outbox
  outbox-relay:
    image: eventhub/core-web:latest
    command: ["python", "bin/outbox_relay.py" ]
    user: root
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      - postgresql
      - rabbitmq

