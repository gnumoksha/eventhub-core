services:
  app-web:
    image: eventhub/core-web:latest
    build:
      context: .
      dockerfile: ./var/docker/Dockerfile
      target: production
      ssh:
        - default
    ports:
      # Default to the classic port for a plain `docker compose up`. Override per
      # worktree (e.g. WEB_PORT=0 for a random free port) to run stacks in parallel.
      - "${WEB_PORT:-8000}:8000"
    environment:
      # Include development dependencies when working locally
      - UV_NO_DEV=0
      - APP_VERSION=0.0.0
    command: [ "uv", "run", "fastapi", "dev", "src/eventhub_core/main.py", "--host", "0.0.0.0", "--port", "8000" ]
    # Run as root during development so the environment is mutable
    # Alternatively, you could set `UV_PROJECT_ENVIRONMENT` to a path owned by the non-root user
    user: root
    volumes:
      - .:/app
      - /app/.venv
    develop:
      # Create a `watch` configuration to update the app
      # https://docs.docker.com/compose/file-watch/#compose-watch-versus-bind-mounts
      watch:
        # Sync the working directory with the `/app` directory in the container
        - action: sync
          path: .
          target: /app
          # Exclude the project virtual environment — it could be for a
          # different platform in the container
          ignore:
            - .venv/
        # Rebuild the image if dependencies change by checking uv.lock
        - action: rebuild
          path: ./uv.lock

  # Publishes the integration events stored in the transactional outbox
  outbox-relay:
    image: eventhub/core-web:latest
    command: ["uv", "run", "python", "-m", "bin.outbox_relay"]
    user: root
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # it uses ~75MiB of memory
  # consumer-checkin:
  #   image: eventhub/core-web:latest
  #   command: ["uv", "run", "python", "-m", "packages.checkin.bin.events_consumer"]
  #   user: root
  #   volumes:
  #     - .:/app
  #     - /app/.venv
  #   depends_on:
  #     - postgresql
  #     - rabbitmq

  # it uses ~488MiB of memory, less than the approach of one container per consumer
  # check it by running:
  # docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}" | grep "events-consumers"
  events-consumers:
    image: eventhub/core-web:latest
    command: ["uv", "run", "honcho", "start"]
    environment:
      - UV_NO_DEV=0
    user: root
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgresql:
    image: postgres:18
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "database:/var/lib/postgresql"
      - "./var/docker/postgresql/initdb.d:/docker-entrypoint-initdb.d"
    environment:
      POSTGRES_DB: eventhub
      POSTGRES_USER: eventhub
      POSTGRES_PASSWORD: eventhub
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "eventhub", "-d", "eventhub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: eventhub
      RABBITMQ_DEFAULT_PASS: eventhub
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    # TODO decrease the log level
    # https://github.com/docker-library/rabbitmq/issues/118
    #RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit log.console.level warning

volumes:
  database:
